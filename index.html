<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistem Manajemen Radioterapi · RS Siloam Agora</title>
  <meta name="description" content="Sistem Manajemen Radioterapi RS Siloam Agora">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1F5FBF">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- PWA: bisa dipasang ke layar utama Android & iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Radioterapi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Boot: hanya tampil sampai halaman masuk / aplikasi siap -->
  <script>
  (function () {
    function show(m) {
      var b = document.getElementById('boot'); if (!b || b.hidden) return;
      b.innerHTML = '<div style="max-width:560px;padding:24px;text-align:center"><b style="color:#991B1B;font-size:16px">Aplikasi gagal dimuat</b>' +
        '<p style="margin:10px 0 14px;font-size:13px;word-break:break-word;color:#5B6B85">' + String(m).replace(/[<>&]/g, '') + '</p>' +
        '<button onclick="location.reload()" style="height:42px;padding:0 18px;border:0;border-radius:10px;background:#1F5FBF;color:#fff;font-weight:600;cursor:pointer">Muat ulang</button></div>';
    }
    window.addEventListener('error', function (e) { show((e.message || 'Kesalahan skrip') + (e.lineno ? ' (baris ' + e.lineno + ')' : '')); });
    window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason || 'Kesalahan tidak dikenal'); });
    window.__bootWatch = setTimeout(function () {
      show('Terlalu lama memuat (lebih dari 20 detik). Periksa koneksi internet atau pemblokiran jaringan terhadap script.google.com, cdn.jsdelivr.net, dan fonts.googleapis.com. Tekan F12 lalu tab Console untuk melihat detail.');
    }, 20000);
  })();
  </script>
  <div id="boot" class="boot"><div class="spin"></div><span>Memuat sistem…</span></div>

  <!-- Gerbang: akses ditolak / error -->
  <div id="gate" class="gate card" hidden></div>

  <!-- Halaman masuk (username + password) -->
  <div id="login" class="login" hidden></div>

  <div id="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <div class="lg"><i class="bi bi-radioactive"></i></div>
        <div><b>Siloam Agora</b><small>RADIOTERAPI</small></div>
      </div>
      <div class="navlbl">Menu utama</div>
      <nav class="nav" id="nav">
        <a data-act="nav" data-v="dashboard" tabindex="0" role="link"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
        <a data-act="nav" data-v="pasien" tabindex="0" role="link"><i class="bi bi-people"></i><span>Data Pasien</span></a>
        <a data-act="nav" data-v="carepath" tabindex="0" role="link"><i class="bi bi-activity"></i><span>Alur Layanan</span></a>
        <a data-act="nav" data-v="calendar" tabindex="0" role="link"><i class="bi bi-calendar3"></i><span>Kalender</span></a>
        <a data-act="nav" data-v="inventory" tabindex="0" role="link"><i class="bi bi-box-seam"></i><span>Persediaan</span></a>
        <a data-act="nav" data-v="report" tabindex="0" role="link"><i class="bi bi-bar-chart-line"></i><span>Laporan</span></a>
        <a data-act="nav" data-v="users" id="navUsers" tabindex="0" role="link" hidden><i class="bi bi-person-gear"></i><span>Kelola Users</span></a>
      </nav>
      <div class="side-foot">
        <div class="sf-row">
          <button type="button" class="sf-ic" id="langBtn" data-act="lang" data-noi18n title="Bahasa / Language" aria-label="Bahasa / Language"><i class="bi bi-translate"></i><span class="sf-lg">ID</span></button>
          <button type="button" class="sf-ic" data-act="theme" title="Mode gelap / terang" aria-label="Ganti tema terang/gelap"><i class="bi bi-moon-stars" id="themeIc"></i><span class="sr">Mode gelap</span></button>
          <button type="button" class="sf-ic demo-btn" id="demoBtn" data-act="demo" hidden title="Sembunyikan data pasien untuk rekaman/demo"><i class="bi bi-eye-slash"></i><span class="sr">Mode demo</span></button>
          <span class="sp"></span>
          <button type="button" class="sf-out" data-act="logout" title="Keluar" aria-label="Keluar dari aplikasi"><i class="bi bi-box-arrow-right"></i><span>Keluar</span></button>
        </div>
        <div class="rs"><i class="bi bi-hospital"></i><span id="rsName">RS Siloam Agora</span><i class="dot"></i></div>
      </div>
    </aside>
    <div id="scrim" class="drawer-scrim" data-act="drawer"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn g ic burger" data-act="drawer" aria-label="Buka menu"><i class="bi bi-list"></i></button>
        <div class="search">
          <i class="bi bi-search"></i>
          <input id="gq" class="input" type="search" placeholder="Cari nama atau NRM…" aria-label="Cari pasien berdasarkan nama atau NRM" autocomplete="off">
          <kbd>Ctrl K</kbd>
        </div>
        <div class="top-r">
          <span class="pill ok" id="syncChip"><i class="bi bi-check2-circle"></i><span>Tersinkron</span></span>
          <span class="pill y chip-x" id="stokChip" data-act="nav" data-v="inventory" style="cursor:pointer" hidden></span>
          <div class="me" data-act="akun" role="button" tabindex="0" title="Akun saya" style="cursor:pointer">
            <div class="txt"><b id="meName">—</b><span class="pill navy" id="meRole" style="height:20px;font-size:11px"></span></div>
            <div class="avatar" id="meAv">—</div>
          </div>
        </div>
      </header>

      <div id="alertBar"></div>

      <main id="content">
        <section id="v-dashboard" class="view"></section>
        <section id="v-pasien" class="view"></section>
        <section id="v-detail" class="view"></section>
        <section id="v-carepath" class="view"></section>
        <section id="v-calendar" class="view"></section>
        <section id="v-inventory" class="view"></section>
        <section id="v-report" class="view"></section>
        <section id="v-users" class="view"></section>
      </main>
    </div>
  </div>

  <div id="modalHost"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* PWA opsional */ }); });
  }
  </script>
</body>
</html>
